<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="wheatGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="#FEFCE8"/>
  <path d="M60 105 L60 25" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>
  <!-- Wheat grains left -->
  <ellipse cx="50" cy="35" rx="8" ry="4" fill="url(#wheatGrad)" transform="rotate(-30 50 35)"/>
  <ellipse cx="48" cy="48" rx="9" ry="4.5" fill="url(#wheatGrad)" transform="rotate(-30 48 48)"/>
  <ellipse cx="46" cy="61" rx="9" ry="4.5" fill="url(#wheatGrad)" transform="rotate(-30 46 61)"/>
  <ellipse cx="45" cy="74" rx="8" ry="4" fill="url(#wheatGrad)" transform="rotate(-30 45 74)"/>
  <!-- Wheat grains right -->
  <ellipse cx="70" cy="35" rx="8" ry="4" fill="url(#wheatGrad)" transform="rotate(30 70 35)"/>
  <ellipse cx="72" cy="48" rx="9" ry="4.5" fill="url(#wheatGrad)" transform="rotate(30 72 48)"/>
  <ellipse cx="74" cy="61" rx="9" ry="4.5" fill="url(#wheatGrad)" transform="rotate(30 74 61)"/>
  <ellipse cx="75" cy="74" rx="8" ry="4" fill="url(#wheatGrad)" transform="rotate(30 75 74)"/>
  <!-- Tip grain -->
  <ellipse cx="60" cy="22" rx="4" ry="7" fill="url(#wheatGrad)"/>
  <!-- Awns / bristles -->
  <line x1="60" y1="20" x2="60" y2="8" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="35" x2="35" y2="20" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="35" x2="85" y2="20" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
</svg>
